name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list devices available | head -20

      - name: List project
        run: xcodebuild -project MelodiiSukare.xcodeproj -list

      - name: Build Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project MelodiiSukare.xcodeproj \
            -scheme MelodiiSukare \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/MelodiiSukare.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/MelodiiSukare.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          echo "Found: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r MelodiiSukare.ipa Payload/
          ls -lh MelodiiSukare.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MelodiiSukare-IPA
          path: ${{ runner.temp }}/MelodiiSukare.ipa
          retention-days: 30
          if-no-files-found: error
