name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: List project info
        run: |
          xcodebuild -project MelodiiSukare.xcodeproj -list
          echo "---"
          ls -la MelodiiSukare.xcodeproj/
          echo "---"
          ls -la MelodiiSukare.xcodeproj/xcshareddata/xcschemes/

      - name: Build
        run: |
          set -e
          xcodebuild archive \
            -project MelodiiSukare.xcodeproj \
            -scheme MelodiiSukare \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcpretty || true

      - name: Package IPA
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/build.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p "$RUNNER_TEMP/payload"
          cp -r "$APP" "$RUNNER_TEMP/payload/"
          cd "$RUNNER_TEMP/payload"
          zip -r "$RUNNER_TEMP/MelodiiSukare.ipa" .
          ls -lh "$RUNNER_TEMP/MelodiiSukare.ipa"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MelodiiSukare
          path: ${{ runner.temp }}/MelodiiSukare.ipa
          retention-days: 30
